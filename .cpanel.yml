---
deployment:
  tasks:
    - export DEPLOYPATH=/home/recipco1/repositories/ECO-Capacity-api

    # 1. Copy latest deployed files
    - /bin/rsync -a --delete --exclude='.git' --exclude='.env' --exclude='node_modules' --exclude='node_modules_backup' --exclude='tmp' ./ $DEPLOYPATH/

    # 2. Make sure restart directory exists
    - /bin/mkdir -p $DEPLOYPATH/tmp

    # 3. Remove old restart signal
    - /bin/rm -f $DEPLOYPATH/tmp/restart.txt

    # 4. Create new Passenger restart signal
    - /bin/touch $DEPLOYPATH/tmp/restart.txt

    # 5. Give Passenger enough time to recycle
    - /bin/sleep 5

    # 6. Remove old restart signal
    - /bin/rm -f $DEPLOYPATH/tmp/restart.txt

    # 7. Deployment log
    - /bin/echo "DEPLOYMENT_SUCCESS $(date)" >> $DEPLOYPATH/deployment.log