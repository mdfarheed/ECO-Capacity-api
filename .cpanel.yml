---
deployment:
  tasks:

    # ==========================================
    # PATHS
    # ==========================================
    - export DEPLOYPATH=/home/recipco1/repositories/ECO-Capacity-api/
    - export NODEPATH=/home/recipco1/.nvm/versions/node/v20.20.2/bin


    # ==========================================
    # COPY PROJECT FILES
    # ==========================================
    - /bin/cp -R controllers $DEPLOYPATH
    - /bin/cp -R middleware $DEPLOYPATH
    - /bin/cp -R models $DEPLOYPATH
    - /bin/cp -R routes $DEPLOYPATH
    - /bin/cp -R utils $DEPLOYPATH
    - /bin/cp server.js $DEPLOYPATH
    - /bin/cp package.json $DEPLOYPATH
    - /bin/cp package-lock.json $DEPLOYPATH


    # ==========================================
    # INSTALL DEPENDENCIES
    # ==========================================
    - cd $DEPLOYPATH && $NODEPATH/npm install --omit=dev


    # ==========================================
    # INSTALL PM2
    # ==========================================
    - $NODEPATH/npm install -g pm2


    # ==========================================
    # RESTART BACKEND
    # ==========================================
    - export PATH=$NODEPATH:$PATH
    - cd $DEPLOYPATH && $NODEPATH/pm2 restart eco-backend || $NODEPATH/pm2 start server.js --name eco-backend


    # ==========================================
    # SAVE PM2
    # ==========================================
    - $NODEPATH/pm2 save