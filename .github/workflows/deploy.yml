name: Deploy ECO Capacity Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' '${{ secrets.CPANEL_SSH_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p 26398 recipco.com >> ~/.ssh/known_hosts

      - name: Test SSH
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            "echo SSH_CONNECTION_SUCCESS"

      - name: Deploy
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            'bash -s' <<'REMOTE'

          set -e

          APP="/home/recipco1/repositories/ECO-Capacity-api"

          echo "======================================"
          echo "DEPLOYING ECO CAPACITY API"
          echo "======================================"

          cd "$APP"

          echo "Fetching GitHub..."
          git fetch origin main

          echo "Resetting application..."
          git reset --hard origin/main

          echo "LIVE COMMIT:"
          git log -1 --oneline

          echo "Installing dependencies..."
          npm install --omit=dev

          echo "Restarting Passenger..."

          mkdir -p tmp
          rm -f tmp/restart.txt
          touch tmp/restart.txt

          # Passenger restart signal
          sleep 3

          echo "Checking application files..."
          test -f server.js

          echo "======================================"
          echo "DEPLOY FINISHED"
          echo "======================================"

          REMOTE

      - name: Wait for Passenger
        run: |
          sleep 15

      - name: Verify Live API
        run: |
          echo "Checking live API..."

          curl -fLsS \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            https://eco-api.ecocapacityexchange.com/api/deploy-test

          echo ""
          echo "======================================"
          echo "LIVE API VERIFIED"
          echo "======================================"