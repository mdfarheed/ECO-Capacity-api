name: Deploy ECO Capacity Backend

on:
  push:
    branches:
      - main

concurrency:
  group: eco-capacity-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. SSH CONFIG
      # ==========================================
      - name: Configure SSH
        shell: bash
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' '${{ secrets.CPANEL_SSH_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p 26398 recipco.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts


      # ==========================================
      # 3. TEST SSH
      # ==========================================
      - name: Test SSH
        shell: bash
        run: |
          set -e

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            "echo SSH_CONNECTION_SUCCESS"


      # ==========================================
      # 4. UPDATE SERVER REPOSITORY
      # ==========================================
      - name: Update Backend
        shell: bash
        run: |
          set -e

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            'bash -s' <<'REMOTE_SCRIPT'

          set -e

          APP="/home/recipco1/repositories/ECO-Capacity-api"

          echo "=========================================="
          echo "ECO CAPACITY BACKEND DEPLOY"
          echo "=========================================="

          cd "$APP"

          echo ""
          echo "SERVER PATH:"
          pwd

          echo ""
          echo "FETCHING MAIN..."
          git fetch origin main

          echo ""
          echo "RESETTING TO ORIGIN/MAIN..."
          git reset --hard origin/main

          echo ""
          echo "SERVER COMMIT:"
          git rev-parse HEAD

          echo ""
          echo "SERVER DEPLOY VERSION:"
          grep -n "DEPLOY-TEST" server.js || true

          echo ""
          echo "INSTALLING DEPENDENCIES..."

          npm install --omit=dev

          echo ""
          echo "CREATING PASSENGER RESTART..."

          mkdir -p "$APP/tmp"

          rm -f "$APP/tmp/restart.txt"

          touch "$APP/tmp/restart.txt"

          chmod 755 "$APP/tmp/restart.txt"

          echo ""
          echo "RESTART FILE:"
          ls -la "$APP/tmp/restart.txt"

          echo ""
          echo "PASSENGER PROCESS BEFORE WAIT:"

          ps -ef | grep "[l]snode.*ECO-Capacity-api" || true

          echo ""
          echo "WAITING FOR PASSENGER..."

          sleep 20

          echo ""
          echo "PASSENGER PROCESS AFTER WAIT:"

          ps -ef | grep "[l]snode.*ECO-Capacity-api" || true

          echo ""
          echo "=========================================="
          echo "SERVER DEPLOY STEP COMPLETED"
          echo "=========================================="

          REMOTE_SCRIPT


      # ==========================================
      # 5. VERIFY SERVER CODE
      # ==========================================
      - name: Verify Server
        shell: bash
        run: |
          set -e

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            'bash -s' <<'REMOTE_SCRIPT'

          set -e

          APP="/home/recipco1/repositories/ECO-Capacity-api"

          cd "$APP"

          echo "=========================================="
          echo "VERIFY SERVER"
          echo "=========================================="

          echo ""
          echo "GIT:"
          git log -1 --oneline

          echo ""
          echo "SERVER.JS:"
          grep -n "DEPLOY-TEST" server.js || true

          echo ""
          echo "PASSENGER:"
          ps -ef | grep "[l]snode.*ECO-Capacity-api" || true

          REMOTE_SCRIPT


      # ==========================================
      # 6. WAIT BEFORE LIVE CHECK
      # ==========================================
      - name: Wait For Passenger
        shell: bash
        run: |
          echo "Waiting for Passenger/LiteSpeed..."
          sleep 20


      # ==========================================
      # 7. LIVE API
      # ==========================================
      - name: Verify Live API
        shell: bash
        run: |
          set -e

          URL="https://eco-api.ecocapacityexchange.com/api/deploy-test"

          echo "=========================================="
          echo "LIVE API CHECK"
          echo "=========================================="

          for i in 1 2 3 4 5 6; do

            echo ""
            echo "ATTEMPT $i/6"

            RESPONSE=$(curl \
              --silent \
              --show-error \
              --max-time 30 \
              "$URL" || true)

            echo "RESPONSE:"
            echo "$RESPONSE"

            if echo "$RESPONSE" | grep -q '"success":true'; then

              echo ""
              echo "=========================================="
              echo "LIVE API IS WORKING"
              echo "=========================================="

              exit 0

            fi

            echo "Live API not ready yet."

            sleep 10

          done

          echo ""
          echo "=========================================="
          echo "LIVE API FAILED"
          echo "=========================================="

          exit 1


      # ==========================================
      # 8. FINAL SERVER COMMIT
      # ==========================================
      - name: Final Deployment Check
        shell: bash
        run: |
          set -e

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            "cd /home/recipco1/repositories/ECO-Capacity-api && \
             echo 'FINAL COMMIT:' && \
             git log -1 --oneline && \
             echo 'FINAL VERSION:' && \
             grep -n 'DEPLOY-TEST' server.js || true"

          echo ""
          echo "=========================================="
          echo "CI/CD FINISHED"
          echo "=========================================="