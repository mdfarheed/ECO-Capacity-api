name: Deploy ECO Capacity Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # DEPLOY BACKEND TO CPANEL
      # ==========================================
      - name: Deploy ECO Capacity Backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          port: ${{ secrets.CPANEL_PORT }}
          key: ${{ secrets.CPANEL_SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo "ECO CAPACITY BACKEND DEPLOYMENT"
            echo "======================================"

            # --------------------------------------
            # NODE PATH
            # --------------------------------------
            export NODEPATH=/home/recipco1/.nvm/versions/node/v20.20.2/bin
            export PATH=$NODEPATH:$PATH

            echo "Node:"
            node -v

            echo "NPM:"
            npm -v

            # --------------------------------------
            # PATHS
            # --------------------------------------
            REPOPATH=/home/recipco1/repositories/eco-capacity-git
            DEPLOYPATH=/home/recipco1/repositories/ECO-Capacity-api

            echo "REPOPATH=$REPOPATH"
            echo "DEPLOYPATH=$DEPLOYPATH"

            # --------------------------------------
            # GO TO CPANEL GIT REPOSITORY
            # --------------------------------------
            cd $REPOPATH

            echo "======================================"
            echo "PULLING LATEST GITHUB CODE"
            echo "======================================"

            git fetch origin main
            git reset --hard origin/main

            echo "Latest commit:"
            git log -1 --oneline

            echo "Version in repository:"
            grep -n "DEPLOY-TEST" server.js || true

            # --------------------------------------
            # DEPLOY FILES
            # --------------------------------------
            echo "======================================"
            echo "COPYING BACKEND FILES"
            echo "======================================"

            /bin/cp -f server.js $DEPLOYPATH/
            /bin/cp -f package.json $DEPLOYPATH/
            /bin/cp -f package-lock.json $DEPLOYPATH/

            # --------------------------------------
            # COPY BACKEND DIRECTORIES
            # --------------------------------------
            /bin/cp -R config $DEPLOYPATH/
            /bin/cp -R controllers $DEPLOYPATH/
            /bin/cp -R middleware $DEPLOYPATH/
            /bin/cp -R models $DEPLOYPATH/
            /bin/cp -R routesutils $DEPLOYPATH/

            # --------------------------------------
            # OPTIONAL FILES
            # --------------------------------------
            if [ -f .htaccess ]; then
              /bin/cp -f .htaccess $DEPLOYPATH/
            fi

            # --------------------------------------
            # INSTALL DEPENDENCIES
            # --------------------------------------
            echo "======================================"
            echo "INSTALLING BACKEND DEPENDENCIES"
            echo "======================================"

            cd $DEPLOYPATH

            $NODEPATH/npm ci --omit=dev

            # --------------------------------------
            # PASSENGER RESTART
            # --------------------------------------
            echo "======================================"
            echo "RESTARTING PASSENGER"
            echo "======================================"

            /bin/mkdir -p $DEPLOYPATH/tmp

            /bin/rm -f $DEPLOYPATH/tmp/restart.txt

            /bin/touch $DEPLOYPATH/tmp/restart.txt

            # --------------------------------------
            # VERIFY FILE
            # --------------------------------------
            echo "======================================"
            echo "VERIFYING DEPLOYED FILE"
            echo "======================================"

            grep -n "DEPLOY-TEST" $DEPLOYPATH/server.js

            echo "======================================"
            echo "ECO CAPACITY BACKEND DEPLOYED"
            echo "======================================"