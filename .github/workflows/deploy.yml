name: Deploy ECO Capacity Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 26398 recipco.com >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: |
          ssh -p 26398 recipco1@recipco.com "echo SSH_CONNECTION_SUCCESS"

      - name: Push to cPanel Git Repository
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git remote remove cpanel 2>/dev/null || true

          git remote add cpanel ssh://recipco1@recipco.com:26398/home/recipco1/repositories/eco-capacity-git

          git push cpanel HEAD:main --force