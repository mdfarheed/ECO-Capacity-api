name: Deploy ECO Capacity Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configure SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' '${{ secrets.CPANEL_SSH_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p 26398 recipco.com >> ~/.ssh/known_hosts

      # 3. Test SSH
      - name: Test SSH
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            "echo SSH_CONNECTION_SUCCESS"

      # 4. Push directly to cPanel managed repository
      - name: Push to cPanel Git Repository
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git remote remove cpanel 2>/dev/null || true

          git remote add cpanel \
            ssh://recipco1@recipco.com:26398/home/recipco1/repositories/eco-capacity-git

          GIT_SSH_COMMAND="ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398" \
            git push cpanel HEAD:main --force

      # 5. Verify cPanel repository
      - name: Verify cPanel Repository
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            "cd /home/recipco1/repositories/eco-capacity-git && git log -1 --oneline"

      # 6. Verify deployed application
      - name: Verify Application
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            "cd /home/recipco1/repositories/ECO-Capacity-api && git log -1 --oneline"