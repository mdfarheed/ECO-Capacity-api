name: Deploy ECO Capacity Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout GitHub
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Configure SSH
      # ==========================================
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' '${{ secrets.CPANEL_SSH_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p 26398 recipco.com >> ~/.ssh/known_hosts

      # ==========================================
      # 3. Test SSH
      # ==========================================
      - name: Test SSH
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            "echo SSH_CONNECTION_SUCCESS"

      # ==========================================
      # 4. Prepare server
      # ==========================================
      - name: Prepare Server
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            "mkdir -p /home/recipco1/repositories/ECO-Capacity-api"

      # ==========================================
      # 5. Copy latest GitHub code
      # ==========================================
      - name: Copy Code To Server
        run: |
          tar \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='node_modules' \
            -czf - . | \
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            "tar -xzf - -C /home/recipco1/repositories/ECO-Capacity-api"

      # ==========================================
      # 6. Install + Restart PM2
      # ==========================================
      - name: Install And Restart
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            "bash -lc '
              cd /home/recipco1/repositories/ECO-Capacity-api

              source /home/recipco1/nodevenv/repositories/ECO-Capacity-api/20/bin/activate

              echo \"NODE:\"
              which node
              node -v

              echo \"NPM:\"
              which npm
              npm -v

              echo \"Installing dependencies...\"
              npm install --omit=dev

              echo \"Installing PM2...\"
              npm install -g pm2

              echo \"PM2 PATH:\"
              which pm2
              pm2 -v

              echo \"Stopping old application...\"
              pm2 delete eco-backend || true

              echo \"Starting application...\"
              pm2 start server.js \
                --name eco-backend \
                --interpreter \"$(which node)\" \
                --update-env

              pm2 save

              echo \"================================\"
              echo \"DEPLOY_SUCCESS\"
              echo \"================================\"

              pm2 list
            '"

      # ==========================================
      # 7. Verify
      # ==========================================
      - name: Verify Deployment
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            "bash -lc '
              cd /home/recipco1/repositories/ECO-Capacity-api

              echo \"LIVE SERVER:\"
              pwd

              echo \"FILES:\"
              ls -la

              echo \"PM2 STATUS:\"
              source /home/recipco1/nodevenv/repositories/ECO-Capacity-api/20/bin/activate
              pm2 list
            '"