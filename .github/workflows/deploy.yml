name: Deploy ECO Capacity Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' '${{ secrets.CPANEL_SSH_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p 26398 recipco.com >> ~/.ssh/known_hosts

      - name: Test SSH
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -p 26398 \
            recipco1@recipco.com \
            "echo SSH_CONNECTION_SUCCESS"

      - name: Deploy
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -p 26398 \
            recipco1@recipco.com \
            "cd /home/recipco1/repositories/ECO-Capacity-api && \
             git fetch origin main && \
             git reset --hard origin/main && \
             npm install --omit=dev && \
             mkdir -p tmp && \
             rm -f tmp/restart.txt && \
             touch tmp/restart.txt && \
             echo LIVE_COMMIT && \
             git log -1 --oneline"

      - name: Verify
        run: |
          sleep 10

          curl -fsS \
            https://eco-api.ecocapacityexchange.com/api/deploy-test