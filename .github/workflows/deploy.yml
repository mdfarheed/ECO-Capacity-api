name: Deploy ECO Capacity Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout GitHub
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Configure SSH
      # ==========================================
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' '${{ secrets.CPANEL_SSH_KEY }}' > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p 26398 recipco.com >> ~/.ssh/known_hosts

      # ==========================================
      # 3. Test SSH
      # ==========================================
      - name: Test SSH
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            "echo SSH_CONNECTION_SUCCESS"

      # ==========================================
      # 4. Deploy directly from GitHub
      # ==========================================
      - name: Deploy Backend
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            "cd /home/recipco1/repositories/ECO-Capacity-api && \
             git fetch origin main && \
             git reset --hard origin/main && \
             /home/recipco1/nodevenv/repositories/ECO-Capacity-api/20/bin/npm install --omit=dev && \
             /home/recipco1/nodevenv/repositories/ECO-Capacity-api/20/bin/npm install -g pm2 && \
             /home/recipco1/nodevenv/repositories/ECO-Capacity-api/20/bin/pm2 delete eco-backend || true && \
             /home/recipco1/nodevenv/repositories/ECO-Capacity-api/20/bin/pm2 start server.js \
             --name eco-backend \
             --interpreter /home/recipco1/nodevenv/repositories/ECO-Capacity-api/20/bin/node \
             --update-env && \
             /home/recipco1/nodevenv/repositories/ECO-Capacity-api/20/bin/pm2 save && \
             echo DEPLOY_SUCCESS && \
             git log -1 --oneline"

      # ==========================================
      # 5. Verify live files
      # ==========================================
      - name: Verify Deployment
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            "cd /home/recipco1/repositories/ECO-Capacity-api && \
             echo 'LIVE COMMIT:' && \
             git log -1 --oneline && \
             echo 'PM2:' && \
             /home/recipco1/nodevenv/repositories/ECO-Capacity-api/20/bin/pm2 list"