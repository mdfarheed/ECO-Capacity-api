name: Deploy ECO Capacity Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # DEPLOY DIRECTLY TO CPANEL
      # ==========================================
      - name: Deploy Backend to cPanel
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          port: ${{ secrets.CPANEL_PORT }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          timeout: 60s
          command_timeout: 20m

          script: |
            set -e

            echo "======================================"
            echo "ECO CAPACITY BACKEND DEPLOYMENT"
            echo "======================================"

            export NODEPATH=/home/recipco1/.nvm/versions/node/v20.20.2/bin
            export PATH=$NODEPATH:$PATH

            REPOPATH=/home/recipco1/repositories/ECO-Capacity-api

            echo "======================================"
            echo "SERVER"
            echo "======================================"

            whoami
            hostname

            echo "======================================"
            echo "DEPLOY PATH"
            echo "======================================"

            cd $REPOPATH

            echo "Current directory:"
            pwd

            echo "======================================"
            echo "FETCH LATEST GITHUB CODE"
            echo "======================================"

            git fetch origin main

            echo "Remote commit:"
            git rev-parse origin/main

            echo "======================================"
            echo "RESET LIVE APP TO LATEST COMMIT"
            echo "======================================"

            git reset --hard origin/main

            echo "======================================"
            echo "REMOVE OLD UNTRACKED FILES"
            echo "======================================"

            git clean -fd \
              -e .env \
              -e node_modules \
              -e node_modules_backup \
              -e tmp

            echo "======================================"
            echo "INSTALL DEPENDENCIES"
            echo "======================================"

            $NODEPATH/npm ci --omit=dev

            echo "======================================"
            echo "VERIFY DEPLOYED COMMIT"
            echo "======================================"

            git log -1 --oneline

            echo "VERSION:"
            grep -n "DEPLOY-TEST" server.js || true

            echo "======================================"
            echo "PASSENGER RESTART"
            echo "======================================"

            PID=$(ps -ef | awk '/[l]snode.*ECO-Capacity-api/ {print $2; exit}')

            if [ -n "$PID" ]; then
              echo "Stopping old Passenger process: $PID"
              kill "$PID" || true
              sleep 5
            else
              echo "No existing Passenger process found."
            fi

            echo "Creating Passenger restart trigger..."

            mkdir -p "$REPOPATH/tmp"
            rm -f "$REPOPATH/tmp/restart.txt"
            touch "$REPOPATH/tmp/restart.txt"

            echo "======================================"
            echo "WAITING FOR PASSENGER"
            echo "======================================"

            sleep 10

            echo "======================================"
            echo "NEW PASSENGER PROCESS"
            echo "======================================"

            ps -ef | grep "[l]snode.*ECO-Capacity-api" || true

            echo "======================================"
            echo "LIVE API CHECK"
            echo "======================================"

            curl -sS \
              --max-time 30 \
              https://eco-api.ecocapacityexchange.com/api/deploy-test

            echo
            echo "======================================"
            echo "ECO CAPACITY BACKEND DEPLOYED"
            echo "======================================"