name: Deploy ECO Capacity Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================
      # 2. SSH CONFIGURATION
      # ==========================================
      - name: Configure SSH
        shell: bash
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' '${{ secrets.CPANEL_SSH_KEY }}' > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p 26398 recipco.com >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts


      # ==========================================
      # 3. TEST SSH
      # ==========================================
      - name: Test SSH
        shell: bash
        run: |
          set -e

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            "echo SSH_CONNECTION_SUCCESS"


      # ==========================================
      # 4. DEPLOY
      # ==========================================
      - name: Deploy Backend
        shell: bash
        run: |
          set -e

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            'bash -s' <<'REMOTE_SCRIPT'

          set -e

          APP="/home/recipco1/repositories/ECO-Capacity-api"

          echo "=========================================="
          echo "ECO CAPACITY BACKEND DEPLOYMENT"
          echo "=========================================="

          cd "$APP"

          echo ""
          echo "APPLICATION:"
          pwd

          echo ""
          echo "FETCHING GITHUB..."
          git fetch origin main

          echo ""
          echo "SYNCING CODE..."
          git reset --hard origin/main

          echo ""
          echo "CURRENT COMMIT:"
          git log -1 --oneline

          echo ""
          echo "CHECKING STARTUP FILES..."

          test -f server.js
          test -f app.js

          echo "server.js      OK"
          echo "app.js         OK"

          echo ""
          echo "INSTALLING DEPENDENCIES..."

          npm install --omit=dev

          echo ""
          echo "CREATING PASSENGER TMP..."

          mkdir -p tmp

          rm -f tmp/restart.txt

          touch tmp/restart.txt

          echo ""
          echo "PASSENGER RESTART REQUESTED"

          echo ""
          echo "WAITING FOR PASSENGER..."

          sleep 10

          echo ""
          echo "PASSENGER PROCESS:"

          ps -ef | grep "[l]snode" || true

          echo ""
          echo "DEPLOYED VERSION:"

          grep -n "DEPLOY-TEST" server.js || true

          echo ""
          echo "=========================================="
          echo "DEPLOYMENT COMMANDS COMPLETED"
          echo "=========================================="

          REMOTE_SCRIPT


      # ==========================================
      # 5. WAIT FOR LIVE APP
      # ==========================================
      - name: Wait For Passenger
        shell: bash
        run: |
          echo "Waiting for Passenger..."
          sleep 15


      # ==========================================
      # 6. LIVE API CHECK
      # ==========================================
      - name: Verify Live API
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "LIVE API CHECK"
          echo "=========================================="

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --max-time 30 \
            --output /tmp/api-response.txt \
            --write-out "%{http_code}" \
            https://eco-api.ecocapacityexchange.com/api/deploy-test)

          echo ""
          echo "HTTP STATUS:"
          echo "$HTTP_CODE"

          echo ""
          echo "API RESPONSE:"
          cat /tmp/api-response.txt

          echo ""

          if [ "$HTTP_CODE" != "200" ]; then
            echo ""
            echo "LIVE API FAILED"
            echo "HTTP STATUS: $HTTP_CODE"
            exit 1
          fi

          if ! grep -q '"success":true' /tmp/api-response.txt; then
            echo ""
            echo "API RESPONSE IS NOT VALID"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "LIVE API IS WORKING"
          echo "=========================================="


      # ==========================================
      # 7. FINAL SERVER VERIFICATION
      # ==========================================
      - name: Verify Server
        shell: bash
        run: |
          set -e

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 26398 \
            recipco1@recipco.com \
            'bash -s' <<'REMOTE_VERIFY'

          APP="/home/recipco1/repositories/ECO-Capacity-api"

          cd "$APP"

          echo "=========================================="
          echo "FINAL SERVER VERIFICATION"
          echo "=========================================="

          echo ""
          echo "COMMIT:"
          git log -1 --oneline

          echo ""
          echo "STARTUP FILE:"
          ls -lh app.js

          echo ""
          echo "SERVER FILE:"
          ls -lh server.js

          echo ""
          echo "RESTART FILE:"
          ls -lh tmp/restart.txt

          echo ""
          echo "PASSENGER:"
          ps -ef | grep "[l]snode" || true

          echo ""
          echo "=========================================="
          echo "CI/CD COMPLETE"
          echo "=========================================="

          REMOTE_VERIFY